name: Verdent CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verdent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-validation:
    name: Project documentation and structure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate required project documents
        run: node .github/scripts/validate-docs.mjs

  application:
    name: Application quality gates
    runs-on: ubuntu-latest
    if: ${{ hashFiles('package.json') != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (pnpm)
        if: hashFiles('pnpm-lock.yaml') != ''
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Install dependencies (npm)
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Install dependencies (Yarn)
        if: hashFiles('yarn.lock') != ''
        run: corepack yarn install --immutable
      - name: Require a committed lockfile
        if: hashFiles('pnpm-lock.yaml') == '' && hashFiles('package-lock.json') == '' && hashFiles('yarn.lock') == ''
        run: |
          echo '::error::package.json exists but no supported lockfile was found. Commit a supported lockfile.'
          exit 1
      - name: Run lint, typecheck, tests, and build
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.lint ? 0 : 1)"; then npm run lint; fi
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.typecheck ? 0 : 1)"; then npm run typecheck; fi
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then npm test; fi
          node -e "const p=require('./package.json'); if (!p.scripts?.build) { console.error('A package.json build script is required.'); process.exit(1); }"
          npm run build

# No deployment job until a real hosting target, protected environment,
# secrets contract, health checks, and rollback procedure are defined.
